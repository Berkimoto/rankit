<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join RankIt Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #2E3440;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .card {
      background: rgba(255,255,255,0.05);
      border: 1.5px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 360px;
      width: 100%;
    }
    .emoji { font-size: 56px; margin-bottom: 16px; }
    h1 { font-size: 24px; font-weight: 900; color: #F5C200; margin-bottom: 8px; }
    p  { font-size: 14px; color: rgba(255,255,255,0.6); line-height: 1.5; margin-bottom: 24px; }
    .code {
      background: rgba(245,194,0,0.15);
      border: 1.5px solid #F5C200;
      border-radius: 12px;
      padding: 16px;
      font-size: 32px;
      font-weight: 900;
      color: #F5C200;
      letter-spacing: 4px;
      margin-bottom: 24px;
    }
    .btn {
      display: block;
      background: #F5C200;
      color: #2E3440;
      font-size: 15px;
      font-weight: 900;
      padding: 16px;
      border-radius: 12px;
      text-decoration: none;
      margin-bottom: 12px;
    }
    .btn-secondary {
      display: block;
      background: transparent;
      color: rgba(255,255,255,0.5);
      font-size: 13px;
      padding: 8px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">🎯</div>
    <h1>You're invited!</h1>
    <p>Join this RankIt game</p>
    <div class="code" id="roomCode">---</div>
    <a class="btn" id="openApp" href="#">Open in RankIt</a>
    <a class="btn-secondary" id="downloadBtn" href="https://apps.apple.com/app/id6767127584">
      Don't have the app? Download RankIt →
    </a>
  </div>
  <script>
    const pathParts = window.location.pathname.split('/');
    const joinIndex = pathParts.indexOf('join');
    const roomCode  = joinIndex !== -1 ? pathParts[joinIndex + 1] : null;

    if (roomCode) {
      document.getElementById('roomCode').textContent = roomCode;
      document.getElementById('openApp').href = `rankit://join/${roomCode}`;

      // Download butonunu platforma göre ayarla
      const isAndroid = /android/i.test(navigator.userAgent);
      document.getElementById('downloadBtn').href = isAndroid
        ? 'https://play.google.com/store/apps/details?id=com.laineberksoy.rankit'
        : 'https://apps.apple.com/app/id6767127584';
    } else {
      window.location.href = 'https://berkimoto.github.io/rankit/';
    }
  </script>
</body>
</html>
